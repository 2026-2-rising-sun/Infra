# member-service — 회원 도메인
# 컨테이너 포트는 5개 서비스 모두 8080 으로 통일한다.
# 로컬에서 5개를 한 호스트에 동시에 띄울 때만 서비스별 포트(member-service = 8081)를 쓴다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: member-service
  labels:
    app.kubernetes.io/name: member-service
    app.kubernetes.io/part-of: shoppinglive
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: member-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: member-service
        app.kubernetes.io/part-of: shoppinglive
    spec:
      securityContext:
        fsGroup: 20001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: member-service
          # TODO: CI 가 커밋 SHA 태그를 채우면 latest 대신 고정 태그로 바꾼다.
          image: ghcr.io/2026-2-rising-sun/member-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9090
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: dev
            - name: SERVER_PORT
              value: "8080"
            - name: MANAGEMENT_SERVER_PORT
              value: "9090"
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: health
            - name: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
              value: never
            - name: MANAGEMENT_ENDPOINT_HEALTH_SHOW_COMPONENTS
              value: never
            - name: MEMBER_JWT_PUBLIC_KEY_SET_LOCATION
              value: file:/run/shoppinglive/jwt/member-public.jwks
            - name: MEMBER_JWT_PRIVATE_KEY_LOCATION
              value: file:/run/shoppinglive/member-private/member-private.pem
            - name: MEMBER_JWT_KEY_ID
              valueFrom:
                configMapKeyRef:
                  name: member-auth-policy
                  key: key-id
            - name: MEMBER_ACCESS_TOKEN_TTL
              valueFrom:
                configMapKeyRef:
                  name: member-auth-policy
                  key: access-token-ttl
            - name: MEMBER_REFRESH_TOKEN_TTL
              valueFrom:
                configMapKeyRef:
                  name: member-auth-policy
                  key: refresh-token-ttl
          volumeMounts:
            - name: member-jwt-public
              mountPath: /run/shoppinglive/jwt
              readOnly: true
            - name: member-jwt-private
              mountPath: /run/shoppinglive/member-private
              readOnly: true
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: member-jwt-public
          configMap:
            name: member-jwt-public
            items:
              - key: member-public.jwks
                path: member-public.jwks
        - name: member-jwt-private
          secret:
            secretName: member-jwt-private
            defaultMode: 0440
            items:
              - key: member-private.pem
                path: member-private.pem

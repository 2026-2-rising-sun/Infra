# notification-service — 알림 도메인 (이벤트 소비 전용)
# 컨테이너 포트는 5개 서비스 모두 8080 으로 통일한다.
# 로컬에서 5개를 한 호스트에 동시에 띄울 때만 서비스별 포트(notification-service = 8085)를 쓴다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: shoppinglive
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  template:
    metadata:
      labels:
        app: notification-service   # 관측 스택(observability/local)이 이 라벨로 파드를 고른다
        app.kubernetes.io/name: notification-service
        app.kubernetes.io/part-of: shoppinglive
    spec:
      containers:
        - name: notification-service
          # TODO: CI 가 커밋 SHA 태그를 채우면 latest 대신 고정 태그로 바꾼다.
          image: ghcr.io/2026-2-rising-sun/notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9090
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: dev
            - name: SERVER_PORT
              value: "8080"
            - name: MANAGEMENT_SERVER_PORT
              value: "9090"
            # Kafka 는 Strimzi 가 만드는 부트스트랩 Service 로 붙는다. 프로필 yml 의 기본값(kafka:9092)보다 env 가 우선한다.
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka-kafka-bootstrap:9092
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: health,prometheus
            - name: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
              value: never
            - name: MANAGEMENT_ENDPOINT_HEALTH_SHOW_COMPONENTS
              value: never
            - name: MEMBER_JWT_PUBLIC_KEY_SET_LOCATION
              value: file:/run/shoppinglive/jwt/member-public.jwks
            - name: MEMBER_SESSION_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: member-session-policy
                  key: member-base-url
            - name: NOTIFICATION_MEMBER_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: notification-member-service-token
                  key: token
          volumeMounts:
            - name: member-jwt-public
              mountPath: /run/shoppinglive/jwt
              readOnly: true
          # startupProbe 가 성공할 때까지 liveness 는 돌지 않는다. JVM 기동은 노트북(kind, CPU 제한)에서
          # 2~3분, OTel 에이전트까지 붙으면 더 걸려서 liveness(30초 + 20초×3)만으로는 기동 중에 죽인다.
          # 10초 × 60회 = 최대 10분까지 기다린다. 기동이 끝난 뒤의 장애 감지는 liveness 가 그대로 맡는다.
          # timeoutSeconds 기본값 1초는 노드가 바쁠 때(여러 JVM 동시 기동) 정상 파드도 시간 초과로 죽인다. 5초로 둔다.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: member-jwt-public
          configMap:
            name: member-jwt-public
            items:
              - key: member-public.jwks
                path: member-public.jwks

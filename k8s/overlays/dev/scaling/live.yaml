# live 는 두 신호로 늘린다. 둘 다 Backend 가 노출하는 Prometheus 지표다 (2단계).
#
#   1) shoppinglive_live_sse_connections — 파드당 열린 SSE 연결 수.
#      열린 연결은 CPU 를 거의 안 쓰고 메모리·소켓만 잡는다. CPU 로는 바빠짐이 안 보인다.
#   2) shoppinglive_broadcast_upcoming_alert_subscribers — 10분 안에 시작하는 방송의 알림 신청자 합.
#      SSE 는 한 번 열리면 기존 파드에 붙어 있어서, 늘어난 파드로 옮겨 가지 않는다.
#      그래서 시청자가 몰리기 '전에' 늘려 둬야 하고, "곧 시작할 방송에 몇 명이 올 예정인가"가 그 신호다.
#      방송마다 예약 시각이 달라 cron 스케일러 대신 이 지표를 쓴다.
#
# metricType: AverageValue 인 이유
#   KEDA/HPA 는 Value 면 "지표값 ≥ threshold 면 늘림"(파드 수와 무관), AverageValue 면
#   "지표값 / 파드 수 가 threshold 를 넘지 않게" 파드 수를 맞춘다. 우리는 둘 다 "파드 하나가
#   감당할 양"을 정하는 것이라 AverageValue 가 맞다.
#     연결 수 1,200 / 500 → 파드 3개,  신청자 2,500 / 1,000 → 파드 3개
#   쿼리에서 sum() 으로 전체 값을 만들어야 이 계산이 성립한다. 파드별 값을 그대로 주면 안 된다.
#
# namespace 라벨로 거르는 이유: Prometheus 는 관측 네임스페이스에서 모든 앱 네임스페이스를 긁는다.
# 팀 환경(shoppinglive-team)의 live 연결 수가 dev 파드 수에 섞여 들어가면 안 된다.
#
# serverAddress 는 관측 네임스페이스의 Service 전체 이름. KEDA 는 keda 네임스페이스에서 질의한다.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: live-service
  labels:
    app.kubernetes.io/name: live-service
    app.kubernetes.io/part-of: shoppinglive
spec:
  scaleTargetRef:
    name: dev-live-service
  minReplicaCount: 1
  maxReplicaCount: 8
  pollingInterval: 15
  cooldownPeriod: 300
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Pods
              value: 4
              periodSeconds: 15
        scaleDown:
          # 방송이 끝나도 시청자가 바로 다 나가지 않는다. 연결이 남아 있는 파드를 줄이면 그 시청자의
          # SSE 가 끊기므로 천천히(5분 창, 1분에 1개) 줄인다.
          stabilizationWindowSeconds: 300
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60
  triggers:
    # 파드당 SSE 연결 500 개. 출발값이며 부하 테스트(시나리오 1)에서 파드 메모리를 보고 확정한다.
    - type: prometheus
      metricType: AverageValue
      metadata:
        serverAddress: http://prometheus.shoppinglive-observability:9090
        query: sum(shoppinglive_live_sse_connections{namespace="shoppinglive-dev",service="live-service"})
        threshold: "500"
        # 파드가 아직 없거나 지표가 비면 0 으로 본다 (스케일링 실패로 멈추지 않게).
        ignoreNullValues: "true"
    # 신청자 1,000 명당 파드 1개. 방송 시작 10분 전부터 값이 생기고, 시작 후 0 으로 돌아간다.
    # 그 뒤에는 위의 실제 연결 수가 파드 수를 받친다.
    - type: prometheus
      metricType: AverageValue
      metadata:
        serverAddress: http://prometheus.shoppinglive-observability:9090
        query: sum(shoppinglive_broadcast_upcoming_alert_subscribers{namespace="shoppinglive-dev"})
        threshold: "1000"
        ignoreNullValues: "true"

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# dev 애플리케이션 계층. replica 1, 리소스 요청을 가장 낮게 잡는다.
namePrefix: dev-

resources:
  - ../../../base

# 서비스 이미지. CI 가 아직 GHCR 에 이미지를 올리지 않아 base 의 :latest 는 받을 수 없다.
# 로컬에서는 platform/kind/build-images.sh 가 Backend 를 빌드해 :local 로 kind 에 적재하고, 여기서 그 태그를 쓴다.
# (imagePullPolicy IfNotPresent 라 적재된 이미지를 그대로 쓴다.) CI 가 올리기 시작하면 커밋 SHA 태그로 바꾼다.
images:
  - name: ghcr.io/2026-2-rising-sun/member-service
    newTag: local
  - name: ghcr.io/2026-2-rising-sun/shopping-service
    newTag: local
  - name: ghcr.io/2026-2-rising-sun/commerce-service
    newTag: local
  - name: ghcr.io/2026-2-rising-sun/live-service
    newTag: local
  - name: ghcr.io/2026-2-rising-sun/notification-service
    newTag: local

# 컨테이너 이름이 서비스마다 달라 strategic merge 로는 한 번에 못 고친다.
# 모든 Deployment 가 컨테이너 1개짜리 같은 모양이므로 인덱스 0 을 대상으로 한다.
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 256Mi
          # CPU 상한 500m 은 JVM 기동을 수 분으로 늘려 probe 에 걸린다(노트북 첫 실행에서 확인). 기동 중에만 많이 쓰고
          # 평시엔 요청값 근처라 상한을 넉넉히 둔다. 메모리는 OTel 에이전트 몫(약 100Mi)을 더해 768Mi.
          limits:
            cpu: "2"
            memory: 768Mi
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: dev,observability
  # trace 전송용 OTel 에이전트 env. :local 이미지와 한 쌍이다(파일 머리 주석 참고).
  - target:
      kind: Deployment
    path: otel-agent-env.yaml
  - target:
      kind: ConfigMap
      name: member-session-policy
    patch: |-
      - op: replace
        path: /data/member-base-url
        value: http://dev-member-service:8080

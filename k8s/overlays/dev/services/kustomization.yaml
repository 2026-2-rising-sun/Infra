apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# dev 애플리케이션 계층. 리소스 요청을 가장 낮게 잡는다. 파드 수는 ../scaling/ 의 KEDA 가 정한다.
namePrefix: dev-

resources:
  - ../../../base

# 서비스 이미지. CI 가 아직 GHCR 에 이미지를 올리지 않아 base 의 :latest 는 받을 수 없다.
# 로컬에서는 platform/kind/build-images.sh 가 Backend 를 빌드해 :local 로 kind 에 적재하고, 여기서 그 태그를 쓴다.
# (imagePullPolicy IfNotPresent 라 적재된 이미지를 그대로 쓴다.) CI 가 올리기 시작하면 커밋 SHA 태그로 바꾼다.
images:
  - name: ghcr.io/2026-2-rising-sun/member-service
    newTag: local
  - name: ghcr.io/2026-2-rising-sun/shopping-service
    newTag: local
  - name: ghcr.io/2026-2-rising-sun/commerce-service
    newTag: local
  - name: ghcr.io/2026-2-rising-sun/live-service
    newTag: local
  - name: ghcr.io/2026-2-rising-sun/notification-service
    newTag: local

# 컨테이너 이름이 서비스마다 달라 strategic merge 로는 한 번에 못 고친다.
# 모든 Deployment 가 컨테이너 1개짜리 같은 모양이므로 인덱스 0 을 대상으로 한다.
patches:
  - target:
      kind: Deployment
    patch: |-
      # replicas 는 매니페스트에서 아예 뺀다. KEDA 가 만든 HPA 가 파드 수를 소유하므로,
      # 매니페스트에 1 이 남아 있으면 apply(또는 ArgoCD selfHeal)할 때마다 1 로 되돌려
      # HPA 와 싸운다. 필드가 없으면 apply 가 파드 수를 건드리지 않는다.
      # (처음 적용 때 한 번은 1 로 돌아가고, HPA 가 곧 최소치로 올린다.)
      - op: remove
        path: /spec/replicas
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 256Mi
          # CPU 상한 500m 은 JVM 기동을 수 분으로 늘려 probe 에 걸리고, 2 는 여섯 개가 동시에 기동할 때 노드를 포화시켜
          # Postgres·Kafka 의 health 체크까지 시간 초과로 죽였다(노트북 첫 실행). 1 이 그 사이 값이다. 기동이 끝나면 요청값 근처.
          # 메모리는 OTel 에이전트 몫(약 100Mi)을 더해 768Mi.
          limits:
            cpu: "1"
            memory: 768Mi
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: dev,observability
  # trace 전송용 OTel 에이전트 env. :local 이미지와 한 쌍이다(파일 머리 주석 참고).
  - target:
      kind: Deployment
    path: otel-agent-env.yaml
  - target:
      kind: ConfigMap
      name: member-session-policy
    patch: |-
      - op: replace
        path: /data/member-base-url
        value: http://dev-member-service:8080

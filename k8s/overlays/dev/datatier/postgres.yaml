# dev 전용 Postgres. local/docker-compose.yml 의 postgres 서비스를 k8s 로 옮긴 것이다.
#
# 관리형 DB(RDS 등) 대신 네임스페이스 안에 단일 pod 로 띄운다. 팀이 커지면 교체한다.
# 볼륨은 emptyDir 이라 pod 가 다시 뜨면 데이터가 사라진다 — dev 는 기능 확인용이고,
# 데이터가 비어야 아래 init 스크립트가 다시 돌아 서비스별 DB 가 재생성되므로 오히려 편하다.
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: shoppinglive
type: Opaque
stringData:
  # dev 전용 폐기 가능한 자격증명. local/.env.example 의 기본값과 같은 값을 쓴다.
  # perf/demo 나 실제 환경에서는 이 파일을 쓰지 말고 외부 시크릿 관리로 주입한다.
  POSTGRES_USER: shoppinglive
  POSTGRES_PASSWORD: changeme
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: shoppinglive
data:
  # local/init/postgres/01-create-databases.sh 와 같은 로직.
  # 데이터 디렉터리가 비어 있을 때(=최초 기동)에만 entrypoint 가 실행한다.
  01-create-databases.sh: |
    #!/bin/bash
    set -euo pipefail

    if [ -z "${POSTGRES_MULTIPLE_DATABASES:-}" ]; then
      echo "POSTGRES_MULTIPLE_DATABASES is not set, skipping per-service database creation"
      exit 0
    fi

    echo "Multiple database creation requested: ${POSTGRES_MULTIPLE_DATABASES}"
    IFS=',' read -ra databases <<< "${POSTGRES_MULTIPLE_DATABASES}"
    for database in "${databases[@]}"; do
      name="$(echo "${database}" | tr -d '[:space:]')"
      echo "Creating database '${name}' owned by '${POSTGRES_USER}'"
      psql -v ON_ERROR_STOP=1 --username "${POSTGRES_USER}" --dbname "${POSTGRES_DB}" \
        -c "CREATE DATABASE \"${name}\" OWNER \"${POSTGRES_USER}\";"
    done
    echo "Per-service databases created"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: shoppinglive
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: shoppinglive
spec:
  replicas: 1
  # 단일 pod + 단일 데이터 디렉터리라 롤링 중 두 개가 겹치면 안 된다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: shoppinglive
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: shoppinglive
            # init 스크립트가 이 목록을 읽어 서비스별 DB 를 하나씩 만든다.
            - name: POSTGRES_MULTIPLE_DATABASES
              value: member,shopping,commerce,live,notification
            # 마운트한 emptyDir 최상위에 lost+found 등이 생겨도 initdb 가 실패하지 않도록 하위 디렉터리를 쓴다.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          emptyDir: {}
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0555

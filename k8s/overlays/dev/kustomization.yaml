apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# dev: 기능 확인용 최소 구성.
#
# 두 계층으로 나눠 둔 이유:
#   services/ — base 의 5개 애플리케이션. namePrefix(dev-)와 replica/리소스/프로필 patch 가 붙는다.
#   datatier/ — dev 네임스페이스 안에 직접 띄우는 Postgres/Redis/Kafka.
#
# 미들웨어를 같은 계층에 두면 (1) namePrefix 때문에 Service 이름이 dev-postgres 가 되어
# Backend 의 dev 프로필이 overlay 의 prefix 규약을 알아야 하고,
# (2) services 쪽 `kind: Deployment` 패치가 미들웨어 Deployment 까지 잡아
# env[0](=SPRING_PROFILES_ACTIVE) 를 덮어쓴다. 그래서 계층을 분리했다.
namespace: shoppinglive-dev

resources:
  - services
  - datatier

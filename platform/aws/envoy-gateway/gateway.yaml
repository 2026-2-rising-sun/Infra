# NLB에서 TLS를 종료한 트래픽만 받는다. 로컬 NodePort 설정을 가져오지 않는다.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shoppinglive
  namespace: __APP_NAMESPACE__
spec:
  gatewayClassName: envoy-gateway
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: nlb
  listeners:
    - name: nlb-tls-terminated
      port: 443
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same

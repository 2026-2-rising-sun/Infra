# 앱 노드 풀. 서비스 5개·Redis·관측 스택이 올라간다.
#
# 스팟을 허용한다. Karpenter 는 스팟과 온디맨드를 둘 다 적으면 스팟을 먼저 고르고 없을 때 온디맨드로 간다.
# 스팟 회수 2분 전 경고는 SQS 큐(modules/karpenter)로 받아 파드를 미리 옮긴다.
# live 의 SSE 연결은 노드가 사라지면 끊기지만, 브라우저가 재연결하고 Redis Pub/Sub 이 이어 주므로 감수한다.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: app
spec:
  template:
    metadata:
      labels:
        shoppinglive.io/node-role: app
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        # 범용(m)·컴퓨팅(c) 7세대 이상 Graviton. 타입을 하나로 못 박지 않아야 스팟 재고가 없을 때 대체가 된다.
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["6"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["large", "xlarge"]
      expireAfter: 720h # 30일. 노드를 주기적으로 갈아 AMI 를 최신으로 유지한다
  # 비용 상한. 이 이상은 Pending 으로 남겨 예산을 지킨다. 부하 테스트 때 올린다.
  limits:
    cpu: "32"
    memory: 64Gi
  disruption:
    # 비었거나 덜 찬 노드를 합친다. 방송 중에 노드가 합쳐지면 SSE 가 끊기므로 안정화 시간을 10분 둔다.
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 10m

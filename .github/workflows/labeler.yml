name: PR Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5

  size-label:
    runs-on: ubuntu-latest
    steps:
      - uses: codelytv/pr-size-labeler@v1.10.0
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: "size/XS"
          xs_max_size: "9"
          s_label: "size/S"
          s_max_size: "29"
          m_label: "size/M"
          m_max_size: "99"
          l_label: "size/L"
          l_max_size: "499"
          xl_label: "size/XL"
          fail_if_xl: "false"
          # 설명 문서만 제외하고 Terraform·매니페스트·실행용 YAML/JSON은 변경량에 포함한다.
          # v1.10.0은 전체 파일 경로를 Bash 글롭으로 비교한다('*'는 디렉터리 경계도 포함한다).
          files_to_ignore: >-
            *.md *.mdx *.rst *.adoc
            README*.txt */README*.txt docs/*.txt

name: terraform-validate

# terraform 디렉터리를 건드리는 PR 에서만 돈다.
# fmt/validate 만 실행하므로 AWS 자격증명이 필요 없고, 아무 리소스도 만들지 않는다.
on:
  pull_request:
    paths:
      - 'terraform/**'
      - 'platform/aws/**'
      - '.github/workflows/terraform-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: terraform fmt
        run: terraform fmt -check -recursive terraform/

      # envs/* 의 각 루트 모듈을 따로 init/validate 한다.
      # backend=false 로 상태 백엔드 접속 없이 검증만 수행한다.
      - name: terraform validate
        run: |
          set -euo pipefail
          shopt -s nullglob
          roots=(terraform/bootstrap/main.tf terraform/envs/*/main.tf terraform/tests/main.tf)
          if [ ${#roots[@]} -eq 0 ]; then
            echo "No terraform root modules under terraform/envs — nothing to validate"
            exit 0
          fi
          for root in "${roots[@]}"; do
            dir="$(dirname "$root")"
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            # 테스트의 mock 별칭은 test 단계에서 해석한다. 구성 검증은 별도로 수행한다.
            terraform -chdir="$dir" validate -no-tests
            echo "::endgroup::"
          done

      - name: AWS 호출 없이 모듈 회귀 검사
        run: terraform -chdir=terraform/tests test

      - name: SPA 경로 회귀 검사
        run: node --test terraform/tests/*.test.cjs

      - name: 오리진 검증 정책 회귀 검사
        run: python3 -m unittest discover -s platform/aws/envoy-gateway -p 'test_*.py'

name: k8s-validate

# k8s 매니페스트를 건드리는 PR 에서만 돈다.
# 각 overlay 를 렌더링해 kustomize 오류(참조 깨짐, patch 경로 불일치 등)를 잡는다.
# 클러스터에 접속하지 않으며 아무것도 배포하지 않는다.
on:
  pull_request:
    paths:
      - 'k8s/**'
      - 'platform/kind/**'
      - 'observability/local/**'
      - 'local/team/**'
      - 'Makefile'
      - '.github/workflows/k8s-validate.yml'

permissions:
  contents: read

jobs:
  kustomize-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # dev/tools 는 overlay 가 아니라 수동 적용용 묶음이지만 렌더링 오류는 같이 잡는다.
        env: [dev, dev/tools, perf, demo]
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4

      - name: Render k8s/overlays/${{ matrix.env }}
        run: kubectl kustomize "k8s/overlays/${{ matrix.env }}"

  local-observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 로컬 관측 설정 구문과 생성 결과 확인
        run: |
          kubectl kustomize platform/kind/metrics-server > /tmp/metrics-server.yaml
          python3 -m py_compile k8s/local/observe.py observability/local/deploy.py observability/local/instrument.py observability/local/ui.py
          python3 -m py_compile local/team/run.py local/team/seed.py
          python3 -m unittest discover -s local/team -p 'test_*.py'
          python3 -m unittest discover -s k8s/local -p 'test_*.py'
          python3 -m unittest discover -s observability/local -p 'test_*.py'
          python3 k8s/local/observe.py tools > /tmp/tools.json
          python3 observability/local/deploy.py > /tmp/observability.json
          python3 -c 'import json; from pathlib import Path; [json.loads(p.read_text()) for p in [Path("/tmp/tools.json"), Path("/tmp/observability.json"), Path("local/team/versions.json"), *Path("observability/local").glob("dashboard-*.json")]]'

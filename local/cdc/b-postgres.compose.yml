# Temporary independent PostgreSQL for Catalog worker tests on the CDC Lima VM.
# Always set DOCKER_HOST to shoppinglive-cdc's explicit socket before running.
name: catalog-cdc-b
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: catalog_cdc_b
      POSTGRES_PASSWORD: cdc_b_local
      POSTGRES_DB: catalog_cdc_b
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10"]
    ports:
      - "127.0.0.1:25433:5432"
    volumes:
      - b-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog_cdc_b -d catalog_cdc_b"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  b-postgres:

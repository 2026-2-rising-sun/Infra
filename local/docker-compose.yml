# 로컬 개발용 미들웨어 스택 (PostgreSQL / Redis / Kafka)
# 사용법:
#   cp local/.env.example local/.env
#   docker compose -f local/docker-compose.yml up -d
#
# Backend local 프로필의 공통 미들웨어다. 연결값은 local/README.md를 따른다.

name: shoppinglive-local

services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    container_name: shoppinglive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shoppinglive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      # init 스크립트가 아래 목록을 읽어 서비스별 DB 를 하나씩 생성한다.
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES:-member,shopping,commerce,live,notification,catalog,commercecore,payment,member_test,catalog_test,commercecore_test,payment_test,live_test,notification_test,catalog_product_test,commercecore_product_test,commercecore_payment_test,payment_execution_test}
      POSTGRES_DB: ${POSTGRES_USER:-shoppinglive}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shoppinglive}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: shoppinglive-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 데이터 삭제를 사용하는 회귀는 앱 Redis와 분리한다.
  redis-test:
    image: redis:7-alpine
    profiles: ["tests"]
    ports:
      - "127.0.0.1:${REDIS_TEST_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Kafka 단일 브로커. 공식 Apache 이미지이고 4.x 는 KRaft 전용이라 Zookeeper 가 아예 없다.
  # 한 프로세스가 컨트롤러와 브로커를 겸한다.
  #
  # 로컬 Kafka 데이터는 볼륨에 보존하지 않는다. 컨테이너를 다시 만들면 토픽/메시지가 사라지지만,
  # 로컬에서는 auto-create 로 다시 생기므로 문제되지 않고 볼륨 권한 문제를 피할 수 있다.
  kafka:
    image: apache/kafka:4.0.0
    container_name: shoppinglive-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      # PLAINTEXT = 컨테이너 사이, EXTERNAL = 호스트에서 접속.
      # advertised 주소가 달라야 해서 리스너를 둘로 나눠 뒀다.
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-29092}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # 단일 브로커라 복제본을 1로 낮춰야 내부 토픽이 생성된다.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      # 호스트(=Backend 로컬 실행)에서는 EXTERNAL 리스너로 붙는다.
      - "${KAFKA_PORT:-29092}:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # 없는 토픽을 생성하고 topics.tsv 에 보관 기간이 있는 토픽만 retention.ms 를 맞춘다. 그 밖의 기존 설정과 auto-create 는 보존한다.
  kafka-init:
    image: apache/kafka:4.0.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/init/bootstrap.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./init/kafka:/init:ro

  # 테이블은 Backend migration이 생성한다. 등록은 local/cdc/register.py 참고.
  connect:
    image: shoppinglive/catalog-connect:3.3.2-1
    build: ./cdc/connect
    stop_grace_period: 90s
    profiles: ["cdc"]
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      # Kafka expects the parent of the multi-jar plugin directory.
      CONNECT_PLUGIN_PATH: /kafka/connect
      GROUP_ID: catalog-cdc-connect
      CONFIG_STORAGE_TOPIC: _connect-catalog-configs
      OFFSET_STORAGE_TOPIC: _connect-catalog-offsets
      STATUS_STORAGE_TOPIC: _connect-catalog-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_PARTITIONS: "1"
      CONNECT_STATUS_STORAGE_PARTITIONS: "1"
      KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      VALUE_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_HEADER_CONVERTER: org.apache.kafka.connect.storage.SimpleHeaderConverter
      OFFSET_FLUSH_INTERVAL_MS: "1000"
      OFFSET_FLUSH_TIMEOUT_MS: "10000"
      SHUTDOWN_TIMEOUT: "60000"
      HEAP_OPTS: "-Xms128m -Xmx384m"
    ports:
      - "127.0.0.1:${CONNECT_PORT:-18083}:8083"

  # 토스페이먼츠 가짜 서버(WireMock). Backend payment-service local 프로필의 기본 토스 주소(localhost:59080)다.
  # 응답 정의는 mocks/toss/mappings. 실제 토스는 Backend를 toss-real 프로필로 띄울 때만 쓴다.
  toss-mock:
    image: wiremock/wiremock:3.9.1
    container_name: shoppinglive-toss-mock
    restart: unless-stopped
    # JDK HttpClient의 h2c 업그레이드 요청 본문이 비지 않게 끈다.
    command: ["--disable-http2-plain"]
    ports:
      - "127.0.0.1:${TOSS_MOCK_PORT:-59080}:8080"
    volumes:
      - ./mocks/toss:/home/wiremock:ro

  # --- 확인용 관리 UI (tools 프로필) ---
  # 기본 `up` 에는 포함되지 않는다. 필요할 때만:
  #   docker compose -f local/docker-compose.yml --profile tools up -d
  # 인증을 켜지 않았으므로 로컬에서만 쓴다.
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: shoppinglive-kafka-ui
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: shoppinglive-local
      # 컨테이너끼리는 PLAINTEXT 리스너(kafka:9092)로 붙는다.
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"

  # 처음 접속하면 "Add Redis database" 에서 Host: redis, Port: 6379 로 한 번 등록한다.
  # 등록 정보는 redisinsight-data 볼륨에 남는다.
  redisinsight:
    image: redis/redisinsight:3.8.0
    container_name: shoppinglive-redisinsight
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${REDISINSIGHT_PORT:-5540}:5540"
    volumes:
      - redisinsight-data:/data

volumes:
  postgres-data:
  redis-data:
  redisinsight-data:

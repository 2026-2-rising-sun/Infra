name: shoppinglive-p2-local
services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_USER: p2_local
      POSTGRES_PASSWORD: ${P2_POSTGRES_PASSWORD:?Run local/p2/prepare-env.sh first}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${P2_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-p2-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U p2_local -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    logging:
      options: { max-size: "10m", max-file: "2" }
volumes:
  postgres-data:

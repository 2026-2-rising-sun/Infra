server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
# 로컬 메모리 제한보다 큰 기본 블록을 쌓지 않도록 작게 나눠 저장한다.
ingester:
  max_block_bytes: 5242880
  max_block_duration: 5m
  concurrent_flushes: 1
storage:
  trace:
    backend: local
    wal:
      path: /data/wal
    local:
      path: /data/blocks
compactor:
  compaction:
    block_retention: 24h

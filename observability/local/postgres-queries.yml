sl_activity:
  query: "SELECT datname, count(*) FILTER (WHERE wait_event_type = 'Lock') AS lock_waiting, COALESCE(max(EXTRACT(EPOCH FROM (clock_timestamp()-query_start))) FILTER (WHERE wait_event_type = 'Lock'), 0) AS oldest_lock_wait_seconds FROM pg_stat_activity WHERE datname IS NOT NULL GROUP BY datname"
  metrics:
    - datname:
        usage: LABEL
        description: 데이터베이스
    - lock_waiting:
        usage: GAUGE
        description: 잠금 대기 연결 수
    - oldest_lock_wait_seconds:
        usage: GAUGE
        description: 가장 오래된 잠금 대기 초

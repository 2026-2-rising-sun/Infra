global:
  scrape_interval: 15s
  evaluation_interval: 15s
# 알림 규칙은 alerts.yml 에 두고 deploy.py 가 같은 ConfigMap 방식으로 마운트한다.
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: applications
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [__APP_NAMESPACE__]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: "(member|shopping|commerce|live|notification)(-service)?"
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        regex: '9090'
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: "(member|shopping|commerce|live|notification)(-service)?"
        replacement: $1-service
        target_label: service
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
    metrics_path: /actuator/prometheus
  - job_name: infrastructure
    static_configs:
      - targets: ['redis-exporter:9121', 'kafka-exporter:9308', 'postgres-exporter:9187', 'kube-state-metrics:8080', 'alloy:12345', 'prometheus:9090', 'alertmanager:9093']
  - job_name: kubelet
    scheme: https
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      ca_file: /etc/kubelet/ca.crt
    metrics_path: /metrics/cadvisor
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - source_labels: [__meta_kubernetes_node_name]
        target_label: __address__
        replacement: $1:10250
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
  - job_name: nodes
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [__OBSERVER_NAMESPACE__]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: node-exporter
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        regex: '9100'
        action: keep
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node

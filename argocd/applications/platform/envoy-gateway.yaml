# Envoy Gateway (Gateway API 구현체). 차트가 Gateway API CRD 도 같이 설치한다.
# 버전은 platform/kind/components/20-envoy-gateway.sh 와 같아야 kind·EKS 가 같은 동작을 한다.
# sync-wave -2: 앱(HTTPRoute)보다 먼저, 그리고 CRD 가 먼저 깔려야 Gateway 리소스가 받아들여진다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL: docker.io/envoyproxy
    chart: gateway-helm
    targetRevision: v1.9.2

  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # CRD 가 커서 client-side apply 의 어노테이션 크기 한도를 넘는다

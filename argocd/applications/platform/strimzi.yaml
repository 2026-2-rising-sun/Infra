# Strimzi Kafka 오퍼레이터. Kafka·KafkaNodePool·KafkaTopic CR 은 앱 overlay(k8s/overlays/<env>/datatier)에 있고
# 오퍼레이터는 모든 네임스페이스를 감시한다(watchAnyNamespace). 1단계 platform/kind/components/30-strimzi.sh 와 같은 값.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL: quay.io/strimzi-helm
    chart: strimzi-kafka-operator
    targetRevision: 1.3.0
    helm:
      valuesObject:
        watchAnyNamespace: true
        # 오퍼레이터는 시스템 노드에. 브로커 파드는 Kafka CR 의 template 에서 kafka 노드 풀로 보낸다.
        nodeSelector:
          shoppinglive.io/node-role: system
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: strimzi-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

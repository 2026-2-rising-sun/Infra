# 플랫폼 부품(Envoy Gateway, Strimzi, KEDA)용 AppProject.
#
# shoppinglive 프로젝트와 따로 둔 이유: 플랫폼 차트는 CRD·ClusterRole 같은 클러스터 범위 리소스를 만든다.
# 앱 프로젝트는 Namespace 생성만 허용하므로 그 경계를 유지하려면 프로젝트를 나눠야 한다.
# 소스도 이 레포가 아니라 외부 Helm 저장소(OCI 포함)다.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: 클러스터 공통 부품 (Gateway API, Kafka 오퍼레이터, KEDA)

  sourceRepos:
    - https://github.com/2026-2-rising-sun/Infra.git
    - docker.io/envoyproxy # Envoy Gateway OCI 차트
    - quay.io/strimzi-helm # Strimzi OCI 차트 (kind 스크립트는 같은 차트를 GitHub 릴리스 tgz 로 받는다)
    - ghcr.io/kedacore/charts # KEDA OCI 차트

  destinations:
    - server: https://kubernetes.default.svc
      namespace: envoy-gateway-system
    - server: https://kubernetes.default.svc
      namespace: strimzi-system
    - server: https://kubernetes.default.svc
      namespace: keda
    - server: https://kubernetes.default.svc
      namespace: argocd

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
